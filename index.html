function timeToMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function fmtDur(m){if(m<=0)return"0h";const h=Math.floor(m/60),min=m%60;return min===0?`${h}h`:`${h}h${String(min).padStart(2,"0")}m`;}
function fmtBreak(m){if(m<=0)return"0m";const h=Math.floor(m/60),min=m%60;if(h===0)return`${min}m`;return min===0?`${h}h`:`${h}h${String(min).padStart(2,"0")}m`;}
function parseDuration(str){const hm=str.match(/^(\d+)h(\d+)$/);if(hm)return parseInt(hm[1])*60+parseInt(hm[2]);const ho=str.match(/^(\d+(?:\.\d+)?)h$/);if(ho)return Math.round(parseFloat(ho[1])*60);const n=parseFloat(str);if(!isNaN(n))return Math.round(n*60);return 0;}
function isOff(sd,key){const d=sd[key];return!d||d.isOff||d.shifts.length===0;}
function dateToKey(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;}
function keyToDate(key){const[y,m,d]=key.split("-").map(Number);return new Date(y,m-1,d,12);}
function keyToLabel(key){if(!key)return"";const[y,m,d]=key.split("-").map(Number);return`${m}/${d}(${["日","月","火","水","木","金","土"][new Date(y,m-1,d).getDay()]})`;}
function calcStreak(sd,targetKey,overrideIsWork){
  const iw=(key)=>key===targetKey?(overrideIsWork!==null?overrideIsWork:!isOff(sd,key)):!isOff(sd,key);
  if(!iw(targetKey))return 0;
  const target=keyToDate(targetKey);let streak=1;
  for(let i=1;i<=31;i++){const d=new Date(target);d.setDate(d.getDate()-i);const k=dateToKey(d);if(sd[k]===undefined||!iw(k))break;streak++;}
  for(let i=1;i<=31;i++){const d=new Date(target);d.setDate(d.getDate()+i);const k=dateToKey(d);if(sd[k]===undefined||!iw(k))break;streak++;}
  return streak;
}
function getShiftCutoff(ov){
  if(ov.earlyLeave&&ov.earlyLeaveTime)return timeToMin(ov.earlyLeaveTime);
  if(ov.leaveEarly&&ov.leaveEarlyTime)return timeToMin(ov.leaveEarlyTime);
  return null;
}
function calcDayTimes(dayData){
  if(!dayData||dayData.isOff||!dayData.shifts.length)return{constraintMin:0,breakMin:0,workMin:0,earlyLeaveWorkMin:0};
  const ov=dayData.override||{};
  if(ov.absent)return{constraintMin:0,breakMin:0,workMin:0,earlyLeaveWorkMin:0};
  const cutoff=getShiftCutoff(ov);
  const isEarlyLeave=!!(ov.earlyLeave&&ov.earlyLeaveTime);
  let constraintMin=0,breakMin=0,earlyLeaveWorkMin=0;
  for(const sh of dayData.shifts){
    const start=timeToMin(sh.start),end=timeToMin(sh.end);
    let effectiveEnd=end;
    if(cutoff!==null){if(cutoff>start&&cutoff<end)effectiveEnd=cutoff;else if(cutoff<=start)continue;}
    constraintMin+=effectiveEnd-start;
    for(const b of sh.breaks){const bs=timeToMin(b.start),be=timeToMin(b.end);if(bs<effectiveEnd)breakMin+=Math.min(be,effectiveEnd)-bs;}
    if(isEarlyLeave&&cutoff!==null&&cutoff>start&&cutoff<end){
      const shBreak=sh.breaks.reduce((s,b)=>s+(timeToMin(b.end)-timeToMin(b.start)),0);
      earlyLeaveWorkMin+=Math.max(0,end-cutoff-(shBreak-Math.min(shBreak,cutoff-start)));
    }
  }
  return{constraintMin,breakMin,workMin:Math.max(0,constraintMin-breakMin),earlyLeaveWorkMin};
}
function calcDayWage(dayData,hourlyWage,earlyLeaveRate){
  if(!hourlyWage||hourlyWage<=0)return 0;
  if(!dayData||dayData.isOff||!dayData.shifts.length)return 0;
  const ov=dayData.override||{};
  if(ov.absent)return 0;
  const cutoff=getShiftCutoff(ov);
  const isEarlyLeave=!!(ov.earlyLeave&&ov.earlyLeaveTime);
  let total=0;
  for(const sh of dayData.shifts){
    const start=timeToMin(sh.start),end=timeToMin(sh.end);
    const shBreak=sh.breaks.reduce((s,b)=>s+(timeToMin(b.end)-timeToMin(b.start)),0);
    const shWork=end-start-shBreak;
    if(cutoff===null){total+=hourlyWage*(shWork/60);}
    else{
      if(cutoff<=start)continue;
      const effEnd=Math.min(cutoff,end);
      const nw=Math.max(0,effEnd-start-shBreak);
      if(isEarlyLeave){const rw=Math.max(0,shWork-nw);total+=hourlyWage*(nw/60)+hourlyWage*(earlyLeaveRate/100)*(rw/60);}
      else{total+=hourlyWage*(nw/60);}
    }
  }
  return Math.floor(total);
}

function pad2(n){return String(n).padStart(2,"0");}
function toICSUTC(y,mo,d,h,mi){
  const dt=new Date(Date.UTC(y,mo-1,d,h-9,mi,0));
  const p=(n)=>String(n).padStart(2,"0");
  return `${dt.getUTCFullYear()}${p(dt.getUTCMonth()+1)}${p(dt.getUTCDate())}T${p(dt.getUTCHours())}${p(dt.getUTCMinutes())}00Z`;
}
function downloadICS(sd,year,month,eventName){
  const prefix=`${year}-${String(month).padStart(2,"0")}`;
  const entries=Object.entries(sd).filter(([k])=>k.startsWith(prefix)).sort(([a],[b])=>a.localeCompare(b));
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ShiftCalendar//JA","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:シフト","X-WR-TIMEZONE:Asia/Tokyo"];
  let uid=1;
  const stamp=toICSUTC(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate(),new Date().getHours(),new Date().getMinutes());
  for(const [key,day] of entries){
    if(day.isOff||!day.shifts.length||(day.override&&day.override.absent))continue;
    for(const sh of day.shifts){
      const[ky,km,kd]=key.split("-").map(Number);const[sh_h,sh_m]=sh.start.split(":").map(Number);const[eh,em]=sh.end.split(":").map(Number);
      const summary=eventName||(sh.notes.length>0?sh.notes[0]:"勤務");
      const escS=(s)=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
      lines.push("BEGIN:VEVENT",`UID:shift-${key}-${uid++}@shiftcal`,`DTSTAMP:${stamp}`,`DTSTART:${toICSUTC(ky,km,kd,sh_h,sh_m)}`,`DTEND:${toICSUTC(ky,km,kd,eh,em)}`,`SUMMARY:${escS(summary)}`,"END:VEVENT");
    }
  }
  lines.push("END:VCALENDAR");
  const icsContent=lines.join("\r\n");
  const blob=new Blob([icsContent],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const isIOS=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.userAgent.includes("Mac")&&"ontouchend" in document)||/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(isIOS){
    window.location.href=url;
  }else{
    const a=document.createElement("a");a.href=url;a.download=`shift_${year}${pad2(month)}.ics`;document.body.appendChild(a);a.click();document.body.removeChild(a);
  }
  setTimeout(()=>{try{URL.revokeObjectURL(url);}catch{}},15000);
}
function parseShift(text){
  const lines=text.split("\n");const result={};let cur=null;
  const dateRe=/^(\d{1,2})\/(\d{1,2})\s*\(([A-Za-z]+)\)/;
  const timeRe=/^(\s+)(\d{1,2}:\d{2})-(\d{1,2}:\d{2})\s*\(([^)]+)\)/;
  const breakRe=/^\s+\[休\d*\]\s+(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/;
  const offRe=/^\s+----/;
  const DOW_EN=["Su","Mo","Tu","We","Th","Fr","Sa"];
  for(const raw of lines){
    const line=raw.trimEnd();if(!line.trim())continue;
    const dm=line.match(dateRe);
    if(dm){
      const mo=parseInt(dm[1]),day=parseInt(dm[2]),dow=dm[3],year=new Date().getFullYear();
      const key=`${year}-${String(mo).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      // Fill gap days between previous date and this date as isOff
      if(cur){
        const prev=new Date(cur);const next=new Date(year,mo-1,day,12);
        for(let d=new Date(prev);d<next;d.setDate(d.getDate()+1)){
          const k=dateToKey(d);
          if(k!==cur&&!result[k]){
            result[k]={month:d.getMonth()+1,day:d.getDate(),dow:DOW_EN[d.getDay()],shifts:[],isOff:true,override:{}};
          }
        }
      }
      cur=key;result[key]={month:mo,day,dow,shifts:[],isOff:false,override:{}};continue;
    }
    if(!cur)continue;
    if(offRe.test(line)){result[cur].isOff=true;continue;}
    const bm=line.match(breakRe);if(bm){const s=result[cur].shifts;if(s.length)s[s.length-1].breaks.push({start:bm[1],end:bm[2]});continue;}
    const tm=line.match(timeRe);if(tm){result[cur].shifts.push({start:tm[2],end:tm[3],minutes:parseDuration(tm[4].trim()),breaks:[],notes:[]});continue;}
    if(/^\s+\S/.test(line)){const s=result[cur].shifts;if(s.length)s[s.length-1].notes.push(line.trim());}
  }
  return result;
}

function TimelineBar({shift}){
  const startMin=timeToMin(shift.start),span=timeToMin(shift.end)-startMin;
  return(<div style={{height:6,background:"#F0E6DF",borderRadius:4,position:"relative",overflow:"hidden",margin:"4px 0"}}>
    <div style={{position:"absolute",inset:0,background:"linear-gradient(90deg,#4D9DFF,#7EB8FF)",borderRadius:4}}/>
    {shift.breaks.map((b,i)=>{const l=((timeToMin(b.start)-startMin)/span*100).toFixed(1),w=((timeToMin(b.end)-timeToMin(b.start))/span*100).toFixed(1);return<div key={i} style={{position:"absolute",top:0,bottom:0,left:`${l}%`,width:`${w}%`,background:"rgba(255,255,255,0.75)"}}/>;})}</div>);
}

function DayCard({data,todayKey,onClick,wage,earlyLeaveRate}){

  const absent=override.absent;
  const dayOff=absent||dayIsOff||shifts.length===0;
  const{breakMin,workMin,earlyLeaveWorkMin}=calcDayTimes(data);
  const hasFullBreak=breakMin>=60;
  const isToday=data._key===todayKey;
  const isEarlyLeave=!absent&&!!(override.earlyLeave&&override.earlyLeaveTime);
  const isLeaveEarly=!absent&&!!(override.leaveEarly&&override.leaveEarlyTime);
  const dailyWage=wage>0?calcDayWage(data,wage,earlyLeaveRate):0;
  return(
    <div id={`daycard-${data._key}`} onClick={onClick} style={{background:"white",borderRadius:18,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:isToday?"1.5px solid #4D9DFF":"1px solid #F5EFE9",overflow:"hidden",cursor:"pointer"}}>
      <div style={{display:"flex",alignItems:"center",padding:"10px 14px",background:absent?"#FFE3DE":isToday?"#E2EEFF":isSun?"#FFE3DE":isSat?"#E2EEFF":"#FFFBF8",borderBottom:"1px solid #F0E6DF",gap:10}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{fontSize:22,fontWeight:700,lineHeight:1,color:absent?"#FF6F5E":isToday?"#4D9DFF":isSun?"#FF6F5E":isSat?"#4D9DFF":"#3A332E"}}>{day}</div>
            {isToday&&!absent&&<span style={{fontSize:10,fontWeight:700,background:"#4D9DFF",color:"white",borderRadius:20,padding:"1px 7px"}}>今日</span>}
            {absent&&<span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:10,fontWeight:700,background:"#FF6F5E",color:"white",borderRadius:20,padding:"1px 7px"}}><IconSleep size={9}/> 欠勤</span>}
            {isEarlyLeave&&<span style={{fontSize:10,fontWeight:700,background:"#FF9F1C",color:"white",borderRadius:20,padding:"1px 7px"}}>勤務解消</span>}
            {isLeaveEarly&&<span style={{fontSize:10,fontWeight:700,background:"#A78BFA",color:"white",borderRadius:20,padding:"1px 7px"}}>早退</span>}
          </div>
          <div style={{fontSize:11,fontWeight:500,color:"#B0A69E"}}>{DOW_JP[dow]||dow}曜日</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
          {!dayOff&&<>
            <span style={{fontSize:13,fontWeight:700,color:"#3A332E",background:"#E2EEFF",padding:"3px 10px",borderRadius:20}}>勤務 {fmtDur(workMin)}</span>
            {breakMin>0&&<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20,background:hasFullBreak?"#FFEFCE":"#FFF6F1",color:hasFullBreak?"#9A6A00":"#B0A69E",border:hasFullBreak?"1px solid #FFB93D":"1px solid #F0E6DF"}}>休{fmtBreak(breakMin)}</span>}
            {isEarlyLeave&&earlyLeaveWorkMin>0&&<span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20,background:"#FFF0D6",color:"#9A6A00",border:"1px solid #FFB93D"}}>勤解 {fmtDur(earlyLeaveWorkMin)}</span>}
            {wage>0&&<span style={{fontSize:12,fontWeight:700,color:"#1C8863",background:"#DCF6EC",padding:"3px 10px",borderRadius:20}}>¥{dailyWage.toLocaleString()}</span>}
          </>}
          {dayOff&&<span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:13,fontWeight:700,color:absent?"#FF6F5E":"#B0A69E",background:absent?"#FFE3DE":"#FFF6F1",padding:"3px 10px",borderRadius:20}}>{absent&&<IconSleep size={11}/>}{absent?"欠勤":"休日"}</span>}
        </div>
      </div>
      {!dayOff&&<div style={{padding:"8px 14px"}}>
        {shifts.map((sh,i)=>{
          const shBreakMin=sh.breaks.reduce((s,b)=>s+(timeToMin(b.end)-timeToMin(b.start)),0);
          return(
            <div key={i} style={{display:"flex",gap:10,padding:"6px 0",borderTop:i>0?"1px dashed #F0E6DF":"none"}}>
              <div style={{fontSize:13,fontWeight:700,color:"#3A332E",whiteSpace:"nowrap",minWidth:110}}>{sh.start} – {sh.end}</div>
              <div style={{flex:1,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                {shBreakMin>0&&<span style={{fontSize:11,color:"#B0A69E"}}>休憩 {fmtBreak(shBreakMin)}</span>}
                {sh.notes.length>0&&<span style={{fontSize:12,color:"#B0A69E"}}>{sh.notes.join(" · ")}</span>}
              </div>
            </div>
          );
        })}
        {isEarlyLeave&&(()=>{
          const lm=timeToMin(override.earlyLeaveTime);
          let remStart="",remEnd="";
          for(const sh of shifts){const s=timeToMin(sh.start),e=timeToMin(sh.end);if(lm>s&&lm<e){remStart=override.earlyLeaveTime;remEnd=sh.end;}else if(lm<=s){remStart=sh.start;remEnd=sh.end;}}
          const remMin=remStart&&remEnd?timeToMin(remEnd)-timeToMin(remStart):0;
          const remWage=wage>0?Math.floor(wage*(earlyLeaveRate/100)*(remMin/60)):0;
          return <div style={{marginTop:6,padding:"6px 10px",background:"#FFF0D6",borderRadius:14,fontSize:12,color:"#9A6A00",borderLeft:"3px solid #FFB93D"}}>
            <IconBolt/> {override.earlyLeaveTime}に勤務解消　{remStart&&remEnd?`${remStart}–${remEnd} ${fmtDur(remMin)}${wage>0?" ¥"+remWage.toLocaleString():""}`:""}</div>;
        })()}
        {isLeaveEarly&&<div style={{marginTop:6,padding:"6px 10px",background:"#EFE9FF",borderRadius:14,fontSize:12,color:"#7C5CFC",borderLeft:"3px solid #A78BFA"}}>
          <IconWalk/> {override.leaveEarlyTime}に早退
        </div>}
      </div>}
      {dayOff&&!absent&&<div style={{padding:"8px 14px"}}><div style={{fontSize:13,color:"#B0A69E",padding:"4px 0"}}><IconLeaf/> お休み</div></div>}
      {override.memo&&<div style={{padding:"4px 14px 10px",fontSize:12,color:"#7C5CFC",background:"#F5F0FF",borderTop:"1px solid #ECE3FF",lineHeight:1.5,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}><IconNote/> {override.memo}</div>}
    </div>
  );
}

function DayDetailPage({dayKey,dayData,onBack,onSave,earlyLeaveRate:defaultRate}){
  const label=keyToLabel(dayKey);
  const ov=dayData.override||{};
  const[mode,setMode]=useState("detail");
  const[shifts,setShifts]=useState(()=>JSON.parse(JSON.stringify(dayData.shifts||[])));
  const[leaveTime,setLeaveTime]=useState(ov.earlyLeaveTime||"");
  const[leaveEarlyTime,setLeaveEarlyTime]=useState(ov.leaveEarlyTime||"");
  const[memo,setMemo]=useState(dayData.override&&dayData.override.memo||"");
  const saveMemo=()=>{onSave(dayKey,{...dayData,override:{...(dayData.override||{}),memo:memo.trim()}});};
  const{constraintMin,breakMin,workMin,earlyLeaveWorkMin}=calcDayTimes(dayData);
  const absent=ov.absent;
  const isEarlyLeave=!!(ov.earlyLeave&&ov.earlyLeaveTime);
  const isLeaveEarly=!!(ov.leaveEarly&&ov.leaveEarlyTime);
  const btnBase={border:"none",borderRadius:14,padding:"11px 0",fontSize:13,fontWeight:700,cursor:"pointer",width:"100%"};
  const applyAbsent=()=>{onSave(dayKey,{...dayData,override:{...ov,absent:true,earlyLeave:false,leaveEarly:false}});onBack();};
  const removeAbsent=()=>{const nOv={...ov};delete nOv.absent;onSave(dayKey,{...dayData,override:nOv});onBack();};
  const applyEarlyLeave=()=>{if(!leaveTime){alert("解消時刻を入力してください");return;}onSave(dayKey,{...dayData,override:{...ov,earlyLeave:true,earlyLeaveTime:leaveTime,absent:false,leaveEarly:false}});onBack();};
  const removeEarlyLeave=()=>{const nOv={...ov};delete nOv.earlyLeave;delete nOv.earlyLeaveTime;onSave(dayKey,{...dayData,override:nOv});onBack();};
  const applyLeaveEarly=()=>{if(!leaveEarlyTime){alert("早退時刻を入力してください");return;}onSave(dayKey,{...dayData,override:{...ov,leaveEarly:true,leaveEarlyTime:leaveEarlyTime,absent:false,earlyLeave:false}});onBack();};
  const removeLeaveEarly=()=>{const nOv={...ov};delete nOv.leaveEarly;delete nOv.leaveEarlyTime;onSave(dayKey,{...dayData,override:nOv});onBack();};
  const saveShifts=()=>{const valid=shifts.filter(s=>s.start&&s.end&&timeToMin(s.end)>timeToMin(s.start));onSave(dayKey,{...dayData,shifts:valid});onBack();};
  const updateShift=(i,field,val)=>{const s=[...shifts];s[i]={...s[i],[field]:val};if(field==="start"||field==="end"){const st=timeToMin(s[i].start||"0:00"),en=timeToMin(s[i].end||"0:00");if(en>st)s[i].minutes=en-st-s[i].breaks.reduce((t,b)=>t+(timeToMin(b.end)-timeToMin(b.start)),0);}setShifts(s);};
  const removeShift=(i)=>setShifts(shifts.filter((_,j)=>j!==i));
  const addBreak=(i)=>{const s=[...shifts];s[i]={...s[i],breaks:[...s[i].breaks,{start:"12:00",end:"13:00",durationMin:60}]};setShifts(s);};
  const updateBreakDur=(i,bi,durMin)=>{const s=[...shifts];const bs=[...s[i].breaks];const stMin=timeToMin(bs[bi].start||"12:00");const enMin=stMin+durMin;bs[bi]={...bs[bi],end:`${String(Math.floor(enMin/60)).padStart(2,"0")}:${String(enMin%60).padStart(2,"0")}`,durationMin:durMin};s[i]={...s[i],breaks:bs};setShifts(s);};
  const removeBreak=(i,bi)=>{const s=[...shifts];s[i]={...s[i],breaks:s[i].breaks.filter((_,j)=>j!==bi)};setShifts(s);};
  const inp={border:"2px solid #F0E6DF",borderRadius:14,padding:"8px 10px",fontSize:13,outline:"none",background:"white",color:"#3A332E",fontFamily:"inherit"};
  const sec={background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",marginBottom:12};
  return(
    <div style={{fontFamily:"inherit",background:"#FFFFFF",minHeight:"100vh"}}>
      <div style={{background:"#FFFFFF",color:"#3A332E",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #F0E6DF",position:"sticky",top:0,zIndex:100}}>
        <button onClick={onBack} style={{background:"#FFF6F1",border:"none",color:"#3A332E",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
        <div style={{fontSize:18,fontWeight:700}}>{label}</div>
        {absent&&<span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontWeight:700,background:"#FF6F5E",color:"white",borderRadius:20,padding:"2px 8px"}}><IconSleep size={10}/> 欠勤</span>}
        {isEarlyLeave&&<span style={{fontSize:11,fontWeight:700,background:"#FF9F1C",color:"white",borderRadius:20,padding:"2px 8px"}}>勤務解消</span>}
        {isLeaveEarly&&<span style={{fontSize:11,fontWeight:700,background:"#A78BFA",color:"white",borderRadius:20,padding:"2px 8px"}}>早退</span>}
      </div>
      <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
        {mode==="detail"&&<>
          {!absent&&dayData.shifts.length>0&&<div style={sec}>
            <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:12}}>勤務時間</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
              {[["拘束",fmtDur(constraintMin),"#B0A69E"],["休憩",fmtBreak(breakMin),"#9A6A00"],["勤務",fmtDur(workMin),"#4D9DFF"]].map(([l,v,c])=>(
                <div key={l} style={{background:"#FFF6F1",borderRadius:10,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontSize:11,color:"#B0A69E",marginBottom:4}}>{l}</div>
                  <div style={{fontSize:16,fontWeight:700,color:c}}>{v}</div>
                </div>
              ))}
            </div>
            {isEarlyLeave&&(()=>{
              const lm=timeToMin(ov.earlyLeaveTime);
              let remStart="",remEnd="";
              for(const sh of dayData.shifts){const s=timeToMin(sh.start),e=timeToMin(sh.end);if(lm>s&&lm<e){remStart=ov.earlyLeaveTime;remEnd=sh.end;}else if(lm<=s){remStart=sh.start;remEnd=sh.end;}}
              const remMin=remStart&&remEnd?timeToMin(remEnd)-timeToMin(remStart):0;
              return <div style={{padding:"8px 12px",background:"#FFF0D6",borderRadius:14,fontSize:12,color:"#9A6A00",borderLeft:"3px solid #FFB93D",marginBottom:12}}>
                <IconBolt/> {ov.earlyLeaveTime}に勤務解消　{remStart&&remEnd?`${remStart}–${remEnd} ${fmtDur(remMin)}`:""}
              </div>;
            })()}
            {isLeaveEarly&&<div style={{padding:"8px 12px",background:"#EFE9FF",borderRadius:14,fontSize:12,color:"#7C5CFC",borderLeft:"3px solid #A78BFA",marginBottom:12}}>
              <IconWalk/> {ov.leaveEarlyTime}に早退
            </div>}
            <div style={{borderTop:"1px solid #F0E6DF",marginBottom:4}}></div>
            {dayData.shifts.map((sh,i)=>(
              <div key={i} style={{padding:"10px 0",borderTop:i>0?"1px dashed #F0E6DF":"none"}}>
                <div style={{fontSize:14,fontWeight:700,color:"#3A332E"}}>{sh.start} – {sh.end} <span style={{fontSize:12,color:"#4D9DFF",fontWeight:400}}>({fmtDur(sh.minutes)})</span></div>
                {sh.breaks.length>0&&<div style={{fontSize:12,color:"#B0A69E",marginTop:4}}>休憩 {fmtBreak(sh.breaks.reduce((s,b)=>s+(timeToMin(b.end)-timeToMin(b.start)),0))}</div>}
                {sh.notes.map((n,j)=><div key={j} style={{fontSize:12,color:"#B0A69E",marginTop:2}}>{n}</div>)}
              </div>
            ))}
          </div>}
          <div style={sec}>
            <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:12}}>操作</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {<button onClick={()=>setMode("editShift")} style={{...btnBase,background:"#E2EEFF",color:"#4D9DFF"}}><IconPencil/> シフトを編集</button>}
              {!isLeaveEarly?<button onClick={()=>setMode("leaveEarly")} style={{...btnBase,background:"#EFE9FF",color:"#7C5CFC"}}><IconWalk/> 早退を入力</button>:<button onClick={removeLeaveEarly} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E"}}>早退を取り消す</button>}
              {!absent?<button onClick={()=>setMode("absent")} style={{...btnBase,background:"#FFE3DE",color:"#FF6F5E",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}><IconSleep size={12}/> 欠勤にする</button>:<button onClick={removeAbsent} style={{...btnBase,background:"#E2EEFF",color:"#4D9DFF"}}>欠勤を解除する</button>}
              {!isEarlyLeave?<button onClick={()=>setMode("earlyLeave")} style={{...btnBase,background:"#FFF0D6",color:"#9A6A00"}}><IconBolt/> 勤務解消を入力</button>:<button onClick={removeEarlyLeave} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E"}}>勤務解消を取り消す</button>}
            </div>
          </div>
          <div style={sec}>
            <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:10}}>メモ</div>
            <textarea value={memo} onChange={e=>setMemo(e.target.value)} onBlur={saveMemo} placeholder="メモを入力…" style={{width:"100%",height:80,border:"2px solid #F0E6DF",borderRadius:14,padding:10,fontSize:13,resize:"none",outline:"none",background:"#FFFBF8",color:"#3A332E",fontFamily:"inherit"}}/>
            <div style={{fontSize:11,color:"#B0A69E",marginTop:4}}>入力後フォーカスを外すと自動保存されます</div>
          </div>
        </>}
        {mode==="editShift"&&<>
          <div style={sec}>
            <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:16}}>シフトを編集</div>
            {shifts.length===0&&<div style={{fontSize:13,color:"#B0A69E",marginBottom:12}}>シフトがありません。追加してください。</div>}
            {shifts.map((sh,i)=>(
              <div key={i} style={{marginBottom:16,padding:14,background:"#FFF6F1",borderRadius:10}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                  <div><div style={{fontSize:11,color:"#B0A69E",marginBottom:4,fontWeight:700}}>開始</div><input type="time" value={sh.start} onChange={e=>updateShift(i,"start",e.target.value)} style={{...inp,width:"100%"}}/></div>
                  <div><div style={{fontSize:11,color:"#B0A69E",marginBottom:4,fontWeight:700}}>終了</div><input type="time" value={sh.end} onChange={e=>updateShift(i,"end",e.target.value)} style={{...inp,width:"100%"}}/></div>
                </div>
                {sh.breaks.length>0&&<div style={{fontSize:11,color:"#B0A69E",marginBottom:4,fontWeight:700}}>休憩</div>}
                {sh.breaks.map((b,bi)=>{
                  const durMin=b.durationMin||(b.start&&b.end?timeToMin(b.end)-timeToMin(b.start):60);
                  return(
                    <div key={bi} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                      <input type="number" value={durMin} min="1" max="480" onChange={e=>updateBreakDur(i,bi,parseInt(e.target.value)||0)} style={{...inp,width:80}} placeholder="分"/>
                      <span style={{fontSize:12,color:"#B0A69E"}}>分</span>
                      <button onClick={()=>removeBreak(i,bi)} style={{background:"#FFE3DE",border:"none",color:"#FF6F5E",borderRadius:10,padding:"8px 10px",cursor:"pointer",fontSize:12,fontWeight:700}}>削除</button>
                    </div>
                  );
                })}
                <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                  <button onClick={()=>addBreak(i)} style={{fontSize:12,background:"white",border:"2px dashed #E8DDD3",color:"#B0A69E",borderRadius:10,padding:"5px 10px",cursor:"pointer"}}>+ 休憩追加</button>
                  <button onClick={()=>removeShift(i)} style={{fontSize:12,background:"#FFE3DE",border:"none",color:"#FF6F5E",borderRadius:10,padding:"5px 12px",cursor:"pointer",fontWeight:700}}>このシフトを削除</button>
                </div>
              </div>
            ))}
          </div>
          <button onClick={()=>setShifts(s=>[...s,{start:"09:00",end:"18:00",minutes:480,breaks:[],notes:[]}])} style={{...btnBase,background:"#FFF6F1",color:"#3A332E",marginBottom:10}}>+ シフトを追加</button>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setMode("detail")} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E",flex:1}}>キャンセル</button>
            <button onClick={saveShifts} style={{...btnBase,background:"#FF6F5E",color:"white",flex:2}}>保存</button>
          </div>
        </>}
        {mode==="absent"&&<div style={sec}>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:700,color:"#FF6F5E",marginBottom:8}}><IconSleep size={13}/> 欠勤にする</div>
          <div style={{fontSize:13,color:"#B0A69E",marginBottom:16,lineHeight:1.7}}>{label} を欠勤として記録します。<br/>勤務時間・給与の目安は0として計算されます。</div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setMode("detail")} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E",flex:1}}>キャンセル</button>
            <button onClick={applyAbsent} style={{...btnBase,background:"#FF6F5E",color:"white",flex:2}}>欠勤として記録</button>
          </div>
        </div>}
        {mode==="earlyLeave"&&<div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#9A6A00",marginBottom:12}}><IconBolt/> 勤務解消を入力</div>
          <div style={{marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:"#B0A69E",marginBottom:6}}>解消時刻</div><input type="time" value={leaveTime} onChange={e=>setLeaveTime(e.target.value)} style={{...inp,width:"100%"}}/></div>
          <div style={{fontSize:11,color:"#B0A69E",marginBottom:12}}>解消後の給与割合は設定画面で変更できます（現在: {defaultRate}%）</div>
          {leaveTime&&(()=>{
            const lm=timeToMin(leaveTime);
            let remStart="",remEnd="";
            for(const sh of dayData.shifts){const s=timeToMin(sh.start),e=timeToMin(sh.end);if(lm>s&&lm<e){remStart=leaveTime;remEnd=sh.end;}else if(lm<=s){remStart=sh.start;remEnd=sh.end;}}
            const remMin=remStart&&remEnd?timeToMin(remEnd)-timeToMin(remStart):0;
            return <div style={{padding:"10px 14px",background:"#FFF0D6",borderRadius:14,fontSize:12,color:"#9A6A00",marginBottom:16,lineHeight:1.8,borderLeft:"3px solid #FFB93D"}}>
              <IconBolt/> {leaveTime}に勤務解消{remStart&&remEnd?`　${remStart}–${remEnd} ${fmtDur(remMin)}`:""}
            </div>;
          })()}
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setMode("detail")} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E",flex:1}}>キャンセル</button>
            <button onClick={applyEarlyLeave} style={{...btnBase,background:"#FF9F1C",color:"white",flex:2}}>記録する</button>
          </div>
        </div>}
        {mode==="leaveEarly"&&<div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#7C5CFC",marginBottom:12}}><IconWalk/> 早退を入力</div>
          <div style={{marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:"#B0A69E",marginBottom:6}}>早退時刻</div><input type="time" value={leaveEarlyTime} onChange={e=>setLeaveEarlyTime(e.target.value)} style={{...inp,width:"100%"}}/></div>
          {leaveEarlyTime&&<div style={{padding:"10px 14px",background:"#EFE9FF",borderRadius:14,fontSize:12,color:"#7C5CFC",marginBottom:16,lineHeight:1.8,borderLeft:"3px solid #A78BFA"}}>
            <IconWalk/> {leaveEarlyTime}に早退<br/>給与は早退時刻までの勤務時間で計算されます
          </div>}
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setMode("detail")} style={{...btnBase,background:"#FFF6F1",color:"#B0A69E",flex:1}}>キャンセル</button>
            <button onClick={applyLeaveEarly} style={{...btnBase,background:"#A78BFA",color:"white",flex:2}}>記録する</button>
          </div>
        </div>}
        <EasterEgg/>
      </div>
    </div>
  );
}

function ShiftChangePage({shiftData,calYear,calMonth,onBack}){
  const myKeys=Object.keys(shiftData).filter(k=>k.startsWith(`${calYear}-${String(calMonth).padStart(2,"0")}`)).sort();
  const[myKey,setMyKey]=useState("");const[otherDateInput,setOtherDateInput]=useState("");const[otherIsOff,setOtherIsOff]=useState(false);const[otherStart,setOtherStart]=useState("");const[otherEnd,setOtherEnd]=useState("");const[otherNote,setOtherNote]=useState("");
  const otherDateMatch=otherDateInput.trim().match(/^(\d{1,2})\/(\d{1,2})$/);
  const otherKey=otherDateMatch?`${calYear}-${String(parseInt(otherDateMatch[1])).padStart(2,"0")}-${String(parseInt(otherDateMatch[2])).padStart(2,"0")}`:"";
  const adjInfo=(key)=>{
    if(!key)return null;
    const[y,m,d]=key.split("-").map(Number);
    const base=new Date(y,m-1,d);
    const prevKey=dateToKey(new Date(base.getFullYear(),base.getMonth(),base.getDate()-1));
    const nextKey=dateToKey(new Date(base.getFullYear(),base.getMonth(),base.getDate()+1));
    const fmt=(k)=>{
      const d2=shiftData[k];
      if(!d2)return"記録なし";
      if(d2.override&&d2.override.absent)return"欠勤";
      if(d2.isOff||!d2.shifts||d2.shifts.length===0)return"休み";
      return d2.shifts.map(s=>`${s.start}–${s.end}`).join(" / ");
    };
    return{prevLabel:keyToLabel(prevKey),prevShift:fmt(prevKey),nextLabel:keyToLabel(nextKey),nextShift:fmt(nextKey)};
  };
  const result=(()=>{
    if(!myKey||!otherKey)return null;
    const myOrigMin=calcDayTimes(shiftData[myKey]).workMin,myOrigIsOff=isOff(shiftData,myKey);
    const otherMin=(()=>{if(otherIsOff)return 0;if(!otherStart||!otherEnd)return null;const diff=timeToMin(otherEnd)-timeToMin(otherStart);return diff>0?diff:null;})();
    if(otherMin===null)return null;
    const prefix=`${calYear}-${String(calMonth).padStart(2,"0")}`;
    const beforeTotal=Object.keys(shiftData).filter(k=>k.startsWith(prefix)).reduce((s,k)=>s+calcDayTimes(shiftData[k]).workMin,0);
    const myOrigShiftStr=myOrigIsOff?"休日":(!shiftData[myKey]||!shiftData[myKey].shifts.length)?"休日":shiftData[myKey].shifts.map(s=>`${s.start}–${s.end}`).join(" / ");
    const myShiftDetails=(myOrigIsOff||!shiftData[myKey]||!shiftData[myKey].shifts.length)?[]:shiftData[myKey].shifts.map(s=>({start:s.start,end:s.end,minutes:s.minutes,notes:s.notes}));
    const otherShiftDetails=otherIsOff?[]:[{start:otherStart,end:otherEnd,minutes:otherMin,notes:otherNote?[otherNote]:[]}];
    return{myLabel:keyToLabel(myKey),otherLabel:keyToLabel(otherKey),myOrigShiftStr,otherMin,otherIsOff,otherShiftStr:otherIsOff?"休日":`${otherStart}–${otherEnd}`,beforeTotal,afterTotal:beforeTotal-myOrigMin+otherMin,streakBefore:calcStreak(shiftData,myKey,null),streakAfter:calcStreak(shiftData,myKey,otherMin>0),myShiftDetails,otherShiftDetails,myAdj:adjInfo(myKey),otherAdj:adjInfo(otherKey)};
  })();
  const inp={border:"2px solid #F0E6DF",borderRadius:14,padding:"8px 12px",fontSize:13,outline:"none",background:"white",color:"#3A332E",fontFamily:"inherit",width:"100%"};
  const sec={background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",marginBottom:16};
  const lbl={fontSize:12,fontWeight:700,color:"#B0A69E",marginBottom:6,display:"block"};
  return(
    <div style={{fontFamily:"inherit",background:"#FFFFFF",minHeight:"100vh"}}>
      <div style={{background:"#FFFFFF",color:"#3A332E",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #F0E6DF",position:"sticky",top:0,zIndex:100}}>
        <button onClick={onBack} style={{background:"#FFF6F1",border:"none",color:"#3A332E",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
        <div style={{fontSize:18,fontWeight:700}}>シフトチェンジ申請</div>
      </div>
      <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
        <div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:14,display:"flex",alignItems:"center",gap:8}}><span style={{background:"#E2EEFF",color:"#4D9DFF",borderRadius:20,padding:"2px 10px",fontSize:12}}>自分</span>交換するシフト</div>
          <label style={lbl}>日付を選択</label>
          <select value={myKey} onChange={e=>setMyKey(e.target.value)} style={{...inp,cursor:"pointer"}}>
            <option value="">-- 日付を選んでください --</option>
            {myKeys.map(k=><option key={k} value={k}>{keyToLabel(k)}　{isOff(shiftData,k)?"休日":shiftData[k].shifts.map(s=>`${s.start}–${s.end}`).join(" / ")}</option>)}
          </select>
          {myKey&&<div style={{marginTop:10,padding:"10px 14px",background:"#FFF6F1",borderRadius:14,fontSize:13}}><span style={{color:"#B0A69E"}}>現在のシフト：</span><strong style={{color:"#3A332E"}}>{isOff(shiftData,myKey)?"休日":shiftData[myKey].shifts.map(s=>`${s.start}–${s.end}(${fmtDur(s.minutes)})`).join(" / ")}</strong></div>}
        </div>
        <div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:14,display:"flex",alignItems:"center",gap:8}}><span style={{background:"#FFE3DE",color:"#FF6F5E",borderRadius:20,padding:"2px 10px",fontSize:12}}>相手</span>交換してもらうシフト</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            <div><label style={lbl}>日付（例: 6/4）</label><input type="text" placeholder="6/4" value={otherDateInput} onChange={e=>setOtherDateInput(e.target.value)} style={inp}/></div>
            <div style={{display:"flex",flexDirection:"column",justifyContent:"flex-end"}}><label style={{...lbl,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}><input type="checkbox" checked={otherIsOff} onChange={e=>setOtherIsOff(e.target.checked)} style={{width:16,height:16}}/>休日と交換</label></div>
          </div>
          {!otherIsOff&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
            <div><label style={lbl}>開始時間</label><input type="time" value={otherStart} onChange={e=>setOtherStart(e.target.value)} style={inp}/></div>
            <div><label style={lbl}>終了時間</label><input type="time" value={otherEnd} onChange={e=>setOtherEnd(e.target.value)} style={inp}/></div>
          </div>}
          {!otherIsOff&&<div><label style={lbl}>内容（任意）</label><input type="text" placeholder="レジ、品出し　など" value={otherNote} onChange={e=>setOtherNote(e.target.value)} style={inp}/></div>}
        </div>
        {result?(
          <div style={{background:"white",borderRadius:18,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",overflow:"hidden"}}>
            <div style={{background:"#FFE3DE",color:"#C43A2B",padding:"12px 20px",fontSize:14,fontWeight:700}}>書類記入内容</div>
            <div style={{padding:20}}>
              {[{label:"自分のシフト（交換するシフト）",before:`${result.myLabel}　${result.myOrigShiftStr}`,after:`${result.otherLabel}　${result.otherShiftStr}`,beforeDetails:result.myShiftDetails,afterDetails:result.otherShiftDetails,icon:"person"},{label:"相手のシフト（受け取るシフト）",before:`${result.otherLabel}　${result.otherShiftStr}`,after:`${result.myLabel}　${result.myOrigShiftStr}`,beforeDetails:result.otherShiftDetails,afterDetails:result.myShiftDetails,icon:"people"}].map((row,i)=>(
                <div key={i} style={{padding:"14px 0",borderBottom:"1px solid #FFF1E9"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:8}}>{row.icon==="person"?<IconPerson/>:<IconPeople/>} {row.label}</div>
                  <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <span style={{fontSize:14,fontWeight:700,color:"#3A332E",background:"#FFF6F1",padding:"4px 12px",borderRadius:14}}>{row.before}</span>
                    <span style={{color:"#B0A69E",fontSize:18}}>→</span>
                    <span style={{fontSize:14,fontWeight:700,color:"white",background:"#4D9DFF",padding:"4px 12px",borderRadius:14}}>{row.after}</span>
                  </div>
                  {(row.beforeDetails.length>0||row.afterDetails.length>0)&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                    <div>
                      {row.beforeDetails.length===0?<div style={{fontSize:11,color:"#D9CDC3"}}>休日</div>:row.beforeDetails.map((s,j)=>(
                        <div key={j} style={{fontSize:11,color:"#B0A69E",lineHeight:1.6}}>{s.start}–{s.end}（{fmtDur(s.minutes)}）{s.notes.length>0?`・${s.notes.join(" ")}`:""}</div>
                      ))}
                    </div>
                    <div>
                      {row.afterDetails.length===0?<div style={{fontSize:11,color:"#D9CDC3"}}>休日</div>:row.afterDetails.map((s,j)=>(
                        <div key={j} style={{fontSize:11,color:"#4D9DFF",lineHeight:1.6}}>{s.start}–{s.end}（{fmtDur(s.minutes)}）{s.notes.length>0?`・${s.notes.join(" ")}`:""}</div>
                      ))}
                    </div>
                  </div>}
                </div>
              ))}
              <div style={{padding:"14px 0",borderBottom:"1px solid #FFF1E9"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:8}}>前日・翌日のシフト（自分：{result.myLabel}）</div>
                <div style={{background:"#FFF6F1",borderRadius:12,padding:"8px 10px",fontSize:12,color:"#3A332E",lineHeight:1.8}}>
                  <div>前日（{result.myAdj.prevLabel}）　{result.myAdj.prevShift}</div>
                  <div>翌日（{result.myAdj.nextLabel}）　{result.myAdj.nextShift}</div>
                </div>
              </div>
              <div style={{padding:"14px 0",borderBottom:"1px solid #FFF1E9"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:8}}>連勤数（自分）</div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:15,fontWeight:700,color:"#3A332E",background:"#FFF6F1",padding:"4px 14px",borderRadius:14}}>{result.streakBefore===0?"休日":`${result.streakBefore}連勤`}</span>
                  <span style={{color:"#B0A69E",fontSize:18}}>→</span>
                  <span style={{fontSize:15,fontWeight:700,padding:"4px 14px",borderRadius:14,background:result.streakAfter>=5?"#FFE3DE":result.streakAfter===0?"#FFF6F1":"#E2EEFF",color:result.streakAfter>=5?"#FF6F5E":result.streakAfter===0?"#B0A69E":"#3A332E"}}>{result.streakAfter===0?"休日":`${result.streakAfter}連勤`}</span>
                  {result.streakAfter>=5&&<span style={{fontSize:12,color:"#FF6F5E"}}><IconWarning/> 注意</span>}
                </div>
              </div>
              <div style={{padding:"14px 0"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:8}}>月合計勤務時間</div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:15,fontWeight:700,color:"#3A332E",background:"#FFF6F1",padding:"4px 14px",borderRadius:14}}>{fmtDur(result.beforeTotal)}</span>
                  <span style={{color:"#B0A69E",fontSize:18}}>→</span>
                  <span style={{fontSize:15,fontWeight:700,color:"white",padding:"4px 14px",borderRadius:14,background:result.afterTotal>result.beforeTotal?"#1C8863":result.afterTotal<result.beforeTotal?"#FF6F5E":"#B0A69E"}}>{fmtDur(result.afterTotal)}</span>
                  <span style={{fontSize:13,color:"#B0A69E"}}>({result.afterTotal>=result.beforeTotal?"+":""}{fmtDur(result.afterTotal-result.beforeTotal)})</span>

        ):(
          <div style={{textAlign:"center",padding:"32px 20px",color:"#B0A69E",background:"white",borderRadius:18,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9"}}>
            <div style={{fontSize:36,marginBottom:10}}>↔</div>
            <p style={{fontSize:13,lineHeight:1.7}}>自分の日付と相手のシフト情報を<br/>入力すると書類記入内容が表示されます</p>
          </div>
        )}
        <EasterEgg/>
      </div>
    </div>
  );
}

  const[importMsg,setImportMsg]=useState("");

  const handleImportData=()=>{if(!importText.trim())return;try{const parsed=JSON.parse(importText.trim());if(typeof parsed!=="object"||Array.isArray(parsed))throw new Error();localStorage.setItem(STORAGE_KEY,JSON.stringify(parsed));onImport(parsed);setImportMsg("✓ インポート完了！");setImportText("");}catch{setImportMsg("データの形式が正しくありません");}};
  const handleSave=()=>{const next={eventName:eventName.trim(),hourlyWage:hourlyWage.trim(),showWage,earlyLeaveRate:parseInt(earlyLeaveRate)||60};saveSettings(next);onSave(next);onBack();};
  const inp={border:"2px solid #F0E6DF",borderRadius:14,padding:"10px 12px",fontSize:14,outline:"none",background:"white",color:"#3A332E",fontFamily:"inherit",width:"100%"};
  const lbl={fontSize:12,fontWeight:700,color:"#B0A69E",marginBottom:6,display:"block"};
  const sec={background:"white",borderRadius:18,padding:20,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",marginBottom:16};
  return(
    <div style={{fontFamily:"inherit",background:"#FFFFFF",minHeight:"100vh"}}>
      <div style={{background:"#FFFFFF",color:"#3A332E",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid #F0E6DF",position:"sticky",top:0,zIndex:100}}>
        <button onClick={onBack} style={{background:"#FFF6F1",border:"none",color:"#3A332E",width:32,height:32,borderRadius:"50%",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
        <div style={{fontSize:18,fontWeight:700}}>設定</div>
      </div>
      <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
        <div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:16}}>給料の目安</div>
          <label style={lbl}>時給（円）</label>
          <input type="number" placeholder="例: 1200" value={hourlyWage} onChange={e=>setHourlyWage(e.target.value)} style={{...inp,marginBottom:16}} min="0"/>
          <label style={lbl}>勤務解消後の給与割合（%）</label>
          <input type="number" placeholder="60" value={earlyLeaveRate} onChange={e=>setEarlyLeaveRate(e.target.value)} min="0" max="100" style={{...inp,marginBottom:16}}/>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div><div style={{fontSize:13,fontWeight:600,color:"#3A332E"}}>給料表示</div><div style={{fontSize:12,color:"#B0A69E",marginTop:2}}>statsバーに基本給の目安を表示する</div></div>
            <button onClick={()=>setShowWage(v=>!v)} style={{width:48,height:26,borderRadius:13,border:"none",cursor:"pointer",position:"relative",background:showWage?"#4D9DFF":"#E8DDD3",transition:"background 0.2s",flexShrink:0}}>
              <div style={{position:"absolute",top:3,left:showWage?24:3,width:20,height:20,borderRadius:"50%",background:"white",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>

          <label style={lbl}>イベント名</label>
          <input type="text" placeholder="例: 勤務、仕事、バイト" value={eventName} onChange={e=>setEventName(e.target.value)} style={inp}/>
          <div style={{fontSize:12,color:"#B0A69E",marginTop:8,lineHeight:1.6}}>空欄の場合はシフトの仕事内容がイベント名になります。</div>

        <div style={sec}>
          <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:4}}>データのバックアップ</div>
          <div style={{fontSize:12,color:"#B0A69E",marginBottom:16,lineHeight:1.6}}>機種変更や再インストール時に使用します</div>
          <button onClick={handleExport} style={{width:"100%",background:"#E2EEFF",color:"#4D9DFF",border:"2px solid #4D9DFF",padding:"11px 0",borderRadius:14,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:10}}>データをエクスポート（クリップボードにコピー）</button>
          <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder="エクスポートしたデータをここに貼り付け…" style={{width:"100%",height:80,border:"2px solid #F0E6DF",borderRadius:14,padding:10,fontSize:11,fontFamily:"monospace",resize:"none",outline:"none",background:"#FFFBF8",color:"#3A332E",marginBottom:8}}/>
          <button onClick={handleImportData} style={{width:"100%",background:importText.trim()?"#3A332E":"#E8DDD3",color:"white",border:"none",padding:"11px 0",borderRadius:14,fontSize:13,fontWeight:700,cursor:importText.trim()?"pointer":"default"}}>インポートして復元</button>

        <EasterEgg/>
      </div>
    </div>
  );
}

function App(){
  const[page,setPage]=useState("calendar");
  const[detailKey,setDetailKey]=useState(null);
  const[input,setInput]=useState("");
  const[showImport,setShowImport]=useState(false);
  const[shiftData,setShiftData]=useState(()=>{try{const s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):{};}catch{return{};}});
  const[settings,setSettings]=useState(loadSettings);
  const[year,setYear]=useState(new Date().getFullYear());
  const[month,setMonth]=useState(new Date().getMonth()+1);
  const[toast,setToast]=useState("");
  const[showUpdateDialog,setShowUpdateDialog]=useState(false);
  useEffect(()=>{
    try{
      const lastSeen=localStorage.getItem(VERSION_KEY);
      if(lastSeen!==APP_VERSION){setShowUpdateDialog(true);}
    }catch{}
  },[]);
  const closeUpdateDialog=()=>{try{localStorage.setItem(VERSION_KEY,APP_VERSION);}catch{}setShowUpdateDialog(false);};
  useEffect(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(shiftData));}catch{}},[shiftData]);
  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(""),2400);};
  const[importPreview,setImportPreview]=useState(null);
  const summarizeDay=(day)=>{
    if(!day) return "（データなし）";
    if(day.override&&day.override.absent) return "欠勤";
    if(day.isOff||!day.shifts||day.shifts.length===0) return "休み";
    return day.shifts.map(s=>`${s.start}-${s.end}`).join(", ");
  };
  const applyImportData=(parsed)=>{
    setShiftData(prev=>{
      const next={...prev};
      for(const[k,v] of Object.entries(parsed)){
        const prevOverride=prev[k]&&prev[k].override?prev[k].override:{};
        next[k]={...v,override:{...prevOverride}};
      }
      return next;
    });
  };
  const handleImportShift=useCallback(()=>{
    if(!input.trim()){showToast("シフトを貼り付けてください");return;}
    const parsed=parseShift(input);const count=Object.keys(parsed).length;
    if(count===0){showToast("シフトが読み取れませんでした");return;}
    const diffs=Object.keys(parsed).sort().map(k=>{
      const oldSummary=summarizeDay(shiftData[k]);
      const newSummary=summarizeDay(parsed[k]);
      return {key:k,oldSummary,newSummary,changed:oldSummary!==newSummary,isNew:!shiftData[k]};
    });
    const changedDiffs=diffs.filter(d=>d.changed);
    const firstKey=Object.keys(parsed).sort()[0];
    if(changedDiffs.length===0){
      applyImportData(parsed);
      if(firstKey){setYear(parseInt(firstKey.split("-")[0]));setMonth(parseInt(firstKey.split("-")[1]));}
      setShowImport(false);setInput("");
      showToast("変更はありませんでした");
      return;
    }
    setImportPreview({parsed,diffs:changedDiffs,firstKey});
  },[input,shiftData]);
  const confirmImport=()=>{
    if(!importPreview)return;
    applyImportData(importPreview.parsed);
    const{firstKey}=importPreview;
    if(firstKey){setYear(parseInt(firstKey.split("-")[0]));setMonth(parseInt(firstKey.split("-")[1]));}
    const c=Object.keys(importPreview.parsed).length;
    setImportPreview(null);setShowImport(false);setInput("");
    showToast(`${c}日分を反映しました ✓`);
  };
  const handleClear=()=>{const prefix=`${year}-${String(month).padStart(2,"0")}`;setShiftData(prev=>{const n={...prev};Object.keys(n).forEach(k=>{if(k.startsWith(prefix))delete n[k];});return n;});setInput("");showToast("クリアしました");};
  const handleExportICS=()=>{const prefix=`${year}-${String(month).padStart(2,"0")}`;if(!Object.keys(shiftData).some(k=>k.startsWith(prefix)&&!isOff(shiftData,k))){showToast("この月の勤務データがありません");return;}downloadICS(shiftData,year,month,settings.eventName);showToast("カレンダーファイルをダウンロードしました");};
  const handleSaveDay=(key,newData)=>setShiftData(prev=>({...prev,[key]:newData}));
  const prevMonth=()=>{if(month===1){setMonth(12);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===12){setMonth(1);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const calTouchRef=useRef({x:0,y:0});
  const handleCalTouchStart=(e)=>{const t=e.touches[0];calTouchRef.current={x:t.clientX,y:t.clientY};};
  const handleCalTouchEnd=(e)=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-calTouchRef.current.x;
    const dy=t.clientY-calTouchRef.current.y;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0)nextMonth();else prevMonth();
    }
  };
  const todayKey=dateToKey(new Date());
  const prefix=`${year}-${String(month).padStart(2,"0")}`;
  const days=Object.entries(shiftData).filter(([k])=>k.startsWith(prefix)).sort(([a],[b])=>a.localeCompare(b));
  const workDays=days.filter(([,d])=>!d.isOff&&d.shifts.length>0&&!(d.override&&d.override.absent));
  const totalWorkMin=workDays.reduce((s,[,d])=>s+calcDayTimes(d).workMin,0);
  const totalConstraintMin=workDays.reduce((s,[,d])=>s+calcDayTimes(d).constraintMin,0);
  const totalBreakMin=workDays.reduce((s,[,d])=>s+calcDayTimes(d).breakMin,0);
  const wage=settings.hourlyWage?parseInt(settings.hourlyWage):0;
  const earlyLeaveRate=settings.earlyLeaveRate||60;
  const estWage=wage>0?workDays.reduce((s,[,d])=>s+calcDayWage(d,wage,earlyLeaveRate),0):0;
  if(page==="swap")return <ShiftChangePage shiftData={shiftData} calYear={year} calMonth={month} onBack={()=>setPage("calendar")}/>;
  if(page==="settings")return <SettingsPage onBack={()=>setPage("calendar")} onSave={setSettings} onImport={d=>{setShiftData(d);setPage("calendar");}}/>;
  if(page==="dayDetail"&&detailKey&&shiftData[detailKey])return <DayDetailPage dayKey={detailKey} dayData={shiftData[detailKey]} onBack={()=>setPage("calendar")} onSave={handleSaveDay} earlyLeaveRate={earlyLeaveRate}/>;
  return(
    <div style={{fontFamily:"inherit",background:"#FFFFFF",minHeight:"100vh",paddingBottom:24}}>
      <div style={{background:"#FFFFFF",padding:"18px 18px 8px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div style={{fontSize:19,fontWeight:900,color:"#3A332E"}}>シフトカレンダー</div>
          <button onClick={()=>setPage("settings")} style={{background:"#FFF6F1",border:"none",color:"#3A332E",width:36,height:36,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(58,51,46,0.08)"}}><IconSettings/></button>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:999,padding:"6px 8px",boxShadow:"0 2px 8px rgba(58,51,46,0.08)",border:"1px solid #F5EFE9"}}>
          <button onClick={prevMonth} style={{width:32,height:32,border:"none",borderRadius:"50%",background:"#FFE3DE",color:"#C43A2B",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <span style={{fontSize:15,fontWeight:700,color:"#3A332E"}}>{year}年{month}月</span>
          <button onClick={nextMonth} style={{width:32,height:32,border:"none",borderRadius:"50%",background:"#FFE3DE",color:"#C43A2B",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>
      </div>
      <div style={{margin:"4px 18px 14px",padding:"16px 18px",borderRadius:20,background:"linear-gradient(135deg,#FFFFFF,#FFE3DE 160%)",boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:2}}>出勤</div>
          <div style={{fontSize:20,fontWeight:900,color:"#3A332E"}}>{workDays.length}<span style={{fontSize:12,fontWeight:700,color:"#B0A69E"}}>日</span></div>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:2}}>勤務時間</div>
          <div style={{fontSize:20,fontWeight:900,color:"#4D9DFF"}}>{fmtDur(totalWorkMin)}</div>
        </div>
        {totalBreakMin>0&&<div>
          <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:2}}>休憩</div>
          <div style={{fontSize:20,fontWeight:900,color:"#FFB93D"}}>{fmtDur(totalBreakMin)}</div>
        </div>}
        {settings.showWage!==false&&estWage>0&&<div>
          <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:2}}>給与目安</div>
          <div style={{fontSize:20,fontWeight:900,color:"#1C8863"}}>¥{estWage.toLocaleString()}</div>
        </div>}
      </div>
      <div style={{display:"flex",gap:8,margin:"0 18px 18px",overflowX:"auto"}}>
        <button onClick={()=>setShowImport(v=>!v)} style={{display:"flex",alignItems:"center",gap:6,background:showImport?"#FF6F5E":"#FFF0D6",border:"none",color:showImport?"white":"#9A6A00",padding:"9px 16px",borderRadius:999,cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}><IconPencil/> シフト入力</button>
        <button onClick={()=>setPage("swap")} style={{display:"flex",alignItems:"center",gap:6,background:"#E2EEFF",border:"none",color:"#1D5FBF",padding:"9px 16px",borderRadius:999,cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}><IconSwap/> シフトチェンジ</button>
        <button onClick={handleExportICS} style={{display:"flex",alignItems:"center",gap:6,background:"#DCF6EC",border:"none",color:"#1C8863",padding:"9px 16px",borderRadius:999,cursor:"pointer",fontSize:12,fontWeight:700,whiteSpace:"nowrap"}}><IconCal/> 書き出し</button>
      </div>
      <div style={{padding:"0 16px",maxWidth:640,margin:"0 auto"}}>
        {showImport&&<div style={{background:"white",borderRadius:18,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",padding:20,marginBottom:20}}>

          <div style={{fontSize:14,fontWeight:700,color:"#3A332E",marginBottom:10}}>シフトを貼り付け</div>
          <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="シフト文字列をここに貼り付けてください…" style={{width:"100%",height:110,border:"2px solid #F0E6DF",borderRadius:14,padding:12,fontFamily:"monospace",fontSize:12,resize:"vertical",outline:"none",background:"#FFFBF8",color:"#3A332E"}}/>
          <div style={{display:"flex",gap:10,marginTop:10}}>
            <button onClick={handleImportShift} style={{flex:1,background:"#FF6F5E",color:"white",border:"none",padding:"10px 0",borderRadius:14,fontSize:13,fontWeight:700,cursor:"pointer"}}>読み込む</button>
            <button onClick={handleClear} style={{background:"transparent",color:"#B0A69E",border:"2px solid #F0E6DF",padding:"10px 14px",borderRadius:14,fontSize:13,cursor:"pointer"}}>クリア</button>
          </div>
        </div>}

        {/* ── Month Calendar ── */}
        {days.length>0&&(()=>{
          const DOW_LABELS=["日","月","火","水","木","金","土"];
          const firstDay=new Date(year,month-1,1).getDay();
          const daysInMonth=new Date(year,month,0).getDate();
          const cells=[];
          for(let i=0;i<firstDay;i++)cells.push(null);
          for(let d=1;d<=daysInMonth;d++)cells.push(d);
          while(cells.length%7!==0)cells.push(null);
          const dataMap={};
          days.forEach(([k,v])=>{const d=parseInt(k.split("-")[2]);dataMap[d]=v;});
          return(
            <div onTouchStart={handleCalTouchStart} onTouchEnd={handleCalTouchEnd} style={{background:"white",borderRadius:18,boxShadow:"0 2px 12px rgba(58,51,46,0.06)",border:"1px solid #F5EFE9",padding:"16px 12px",marginBottom:20,touchAction:"pan-y"}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:6}}>
                {DOW_LABELS.map((d,i)=>(
                  <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"#FF6F5E":i===6?"#4D9DFF":"#B0A69E",paddingBottom:4}}>{d}</div>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
                {cells.map((d,i)=>{
                  if(!d) return <div key={`e${i}`}/>;
                  const dayData=dataMap[d];
                  const key=`${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                  const isToday2=key===todayKey;
                  const dow=i%7;
                  const isEL=dayData&&dayData.override&&dayData.override.earlyLeave;
                  const isLE=dayData&&dayData.override&&dayData.override.leaveEarly;
                  const absent=dayData&&dayData.override&&dayData.override.absent;
                  const isOff2=!dayData||dayData.isOff||dayData.shifts.length===0||absent;
                  const {breakMin:bm}=dayData&&!isOff2?calcDayTimes(dayData):{breakMin:0};
                  const hasFullBreak=bm>=60;
                  const bg=isToday2?"#4D9DFF":absent?"#FF6F5E":isEL?"#FF9F1C":isLE?"#A78BFA":!isOff2?(hasFullBreak?"#FFF0D6":"#E2EEFF"):"transparent";
                  const border=isToday2?"none":!isOff2?(hasFullBreak?"1px solid #F5D9A8":"1px solid #CFE3FF"):"1px solid transparent";
                  const fc=isToday2?"white":absent?"white":isEL?"white":isLE?"white":dow===0?"#FF6F5E":dow===6?"#4D9DFF":"#3A332E";
                  const timeColor=isToday2?"rgba(255,255,255,0.9)":isEL||isLE?"white":"#4D9DFF";
                  const firstShift=!isOff2&&dayData.shifts.length>0?dayData.shifts[0]:null;
                  const lastShift=!isOff2&&dayData.shifts.length>0?dayData.shifts[dayData.shifts.length-1]:null;
                  const dispStart=firstShift?firstShift.start:"";
                  // if earlyLeave/leaveEarly, cap end time
                  let dispEnd=lastShift?lastShift.end:"";
                  if(isEL&&dayData.override.earlyLeaveTime) dispEnd=lastShift&&timeToMin(dayData.override.earlyLeaveTime)<timeToMin(lastShift.end)?dayData.override.earlyLeaveTime:dispEnd;
                  if(isLE&&dayData.override.leaveEarlyTime) dispEnd=lastShift&&timeToMin(dayData.override.leaveEarlyTime)<timeToMin(lastShift.end)?dayData.override.leaveEarlyTime:dispEnd;
                  // strip leading zero for compact display e.g. "9:30"
                  const fmt=(t)=>t?t.replace(/^0/,""):t;
                  return(
                    <div key={d} onClick={()=>{
                      if(!dayData)return;
                      // scroll to list item
                      const el=document.getElementById(`daycard-${key}`);
                      if(el){el.scrollIntoView({behavior:"smooth",block:"center"});}
                    }} style={{borderRadius:14,padding:"5px 3px",textAlign:"center",background:bg,border,cursor:dayData?"pointer":"default",minHeight:56,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",paddingTop:5}}>
                      <div style={{fontSize:13,fontWeight:700,color:fc,lineHeight:1}}>{d}</div>
                      {!isOff2&&firstShift&&<>
                        <div style={{fontSize:8,color:timeColor,marginTop:3,fontWeight:600,lineHeight:1.4}}>{fmt(dispStart)}</div>
                        <div style={{fontSize:8,color:timeColor,fontWeight:600,lineHeight:1.2}}>↓</div>
                        <div style={{fontSize:8,color:timeColor,fontWeight:600,lineHeight:1.4}}>{fmt(dispEnd)}</div>
                      </>}
                      {absent&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:2,fontSize:9,color:"white",marginTop:3,fontWeight:600}}><IconSleep size={8}/>欠勤</div>}
                      {isOff2&&!absent&&dayData&&<div style={{fontSize:9,color:"#E8DDD3",marginTop:3}}>休</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {days.length===0
          ?<div style={{textAlign:"center",padding:"48px 20px",color:"#B0A69E"}}><div style={{display:"flex",justifyContent:"center",marginBottom:12}}><IconCalendarBig/></div><p style={{fontSize:14,lineHeight:1.7}}>シフト文字列を貼り付けて<br/>「読み込む」を押してください。</p></div>
          :<div style={{display:"flex",flexDirection:"column",gap:10}}>
            {days.map(([key,data])=><DayCard key={key} data={{...data,_key:key}} todayKey={todayKey} wage={settings.showWage!==false?wage:0} earlyLeaveRate={earlyLeaveRate} onClick={()=>{setDetailKey(key);setPage("dayDetail");}}/>)}
          </div>
        }
        <EasterEgg/>
      </div>
      {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#3A332E",color:"white",padding:"10px 20px",borderRadius:24,fontSize:13,fontWeight:500,zIndex:200,boxShadow:"0 4px 16px rgba(0,0,0,0.2)"}}>{toast}</div>}
      {importPreview&&<div style={{position:"fixed",inset:0,background:"rgba(58,51,46,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}} onClick={()=>setImportPreview(null)}>
        <div style={{background:"white",borderRadius:20,padding:24,maxWidth:360,width:"100%",maxHeight:"80vh",display:"flex",flexDirection:"column",boxShadow:"0 12px 36px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:16,fontWeight:900,color:"#3A332E",marginBottom:4}}>この内容で上書きします</div>
          <div style={{fontSize:12,color:"#B0A69E",marginBottom:14}}>変更のある{importPreview.diffs.length}日分だけ表示しています。メモは保持されます。</div>
          <div style={{overflowY:"auto",display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
            {importPreview.diffs.map(d=>(
              <div key={d.key} style={{background:"#FFF6F1",borderRadius:12,padding:"9px 12px"}}>
                <div style={{fontSize:11,fontWeight:700,color:"#B0A69E",marginBottom:3}}>{d.key.slice(5).replace("-","/")}{d.isNew?"（新規）":""}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#3A332E"}}>
                  <span style={{color:d.isNew?"#D9CDC3":"#FF9F1C",textDecoration:d.isNew?"none":"line-through"}}>{d.oldSummary}</span>
                  <span style={{color:"#B0A69E"}}>→</span>
                  <span style={{fontWeight:700,color:"#1C8863"}}>{d.newSummary}</span>
                </div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setImportPreview(null)} style={{flex:1,background:"transparent",color:"#B0A69E",border:"2px solid #F0E6DF",padding:"11px 0",borderRadius:14,fontSize:13,fontWeight:700,cursor:"pointer"}}>キャンセル</button>
            <button onClick={confirmImport} style={{flex:1.4,background:"#FF6F5E",color:"white",border:"none",padding:"11px 0",borderRadius:14,fontSize:13,fontWeight:700,cursor:"pointer"}}>上書きする</button>
          </div>
        </div>
      </div>}
      {showUpdateDialog&&<div style={{position:"fixed",inset:0,background:"rgba(58,51,46,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:20}} onClick={closeUpdateDialog}>
        <div style={{background:"white",borderRadius:20,padding:24,maxWidth:340,width:"100%",boxShadow:"0 12px 36px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{fontSize:20}}>🎉</span>
            <div style={{fontSize:16,fontWeight:900,color:"#3A332E"}}>アップデートしました</div>
          </div>
          <div style={{fontSize:12,color:"#B0A69E",marginBottom:14}}>v{CHANGELOG[0].version}（{CHANGELOG[0].date}）</div>
          <ul style={{margin:0,padding:0,listStyle:"none",display:"flex",flexDirection:"column",gap:9,marginBottom:20}}>
            {CHANGELOG[0].items.map((it,i)=>(
              <li key={i} style={{display:"flex",gap:8,fontSize:13,color:"#3A332E",lineHeight:1.5}}>
                <span style={{color:"#FF6F5E",fontWeight:900}}>•</span>{it}
              </li>
            ))}
          </ul>
          <button onClick={closeUpdateDialog} style={{width:"100%",background:"#FF6F5E",color:"white",border:"none",padding:"12px 0",borderRadius:14,fontSize:14,fontWeight:700,cursor:"pointer"}}>はじめる</button>
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
