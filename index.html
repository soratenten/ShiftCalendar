<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>社内バス時刻表</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="バス時刻表">
<meta name="theme-color" content="#0F1B2D">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1B2D;
    --bg2: #162235;
    --bg3: #1D2E47;
    --bg4: #243450;
    --text: #F0F4FF;
    --text-dim: #8A9BBF;
    --accent: #FFD600;
    --south: #4DAFFF;
    --north: #7AE88A;
    --border: rgba(255,255,255,0.07);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  /* ─── Header ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-datetime {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .header-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .header-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .header-settings-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .header-settings-btn:hover { background: var(--bg3); color: var(--text); }

  /* ─── Closing time selector ─── */
  .closing-bar {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .closing-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .closing-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .closing-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .closing-btn:hover { background: var(--bg4); color: var(--text); }
  .closing-btn.active {
    background: var(--accent);
    color: #0F1B2D;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* ─── Stop tabs ─── */
  .stop-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stop-tab {
    flex: 1;
    padding: 12px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .stop-tab:hover { background: var(--bg3); color: var(--text); }
  .stop-tab.active {
    background: var(--bg3);
    border-color: var(--accent);
    color: var(--accent);
  }
  .stop-tab .stop-icon { font-size: 18px; display: block; margin-bottom: 2px; }

  /* ─── Next bus hero ─── */
  .next-bus-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .next-bus-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .next-bus-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .next-bus-card.south::before { background: var(--south); }
  .next-bus-card.north::before { background: var(--north); }
  .route-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .route-badge.south { background: rgba(77,175,255,0.15); color: var(--south); }
  .route-badge.north { background: rgba(122,232,138,0.15); color: var(--north); }
  .route-dot { width: 6px; height: 6px; border-radius: 50%; }
  .route-dot.south { background: var(--south); }
  .route-dot.north { background: var(--north); }
  .next-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .next-time.south { color: var(--south); }
  .next-time.north { color: var(--north); }
  .next-countdown {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .next-countdown span {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
  }
  .next-countdown span.soon { color: var(--accent); }
  .next-after {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ─── Timetable ─── */
  .timetable-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .route-table {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .route-header {
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .route-header.south { background: rgba(77,175,255,0.1); color: var(--south); border-bottom: 1px solid rgba(77,175,255,0.15); }
  .route-header.north { background: rgba(122,232,138,0.1); color: var(--north); border-bottom: 1px solid rgba(122,232,138,0.15); }

  .time-row {
    display: flex;
    align-items: flex-start;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
    transition: background 0.1s;
  }
  .time-row:last-child { border-bottom: none; }
  .time-row:hover { background: var(--bg3); }
  .time-row.current-hour { background: rgba(255,214,0,0.05); }
  .hour-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    min-width: 28px;
    padding-top: 2px;
  }
  .hour-label.current { color: var(--accent); }
  .minutes-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
  }
  .min-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg3);
    color: var(--text);
    transition: all 0.1s;
  }
  .min-chip.passed {
    background: transparent;
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: rgba(255,255,255,0.2);
  }
  .min-chip.next {
    background: var(--accent);
    color: #0F1B2D;
    font-weight: 700;
  }
  .min-chip.next.south { background: var(--south); color: #0F1B2D; }
  .min-chip.next.north { background: var(--north); color: #0F1B2D; }

  /* ─── Closing note ─── */
  .closing-note {
    text-align: center;
    padding: 14px;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }

  @media (max-width: 480px) {
    .next-bus-grid, .timetable-section { grid-template-columns: 1fr; }
    .next-time { font-size: 24px; }
  }

  /* ─── Page switching ─── */
  .main-page.hidden {
    display: none;
  }
  .settings-page {
    display: none;
  }
  .settings-page.open {
    display: block;
  }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .settings-header h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .settings-back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .settings-back-btn:hover { background: var(--bg3); color: var(--text); }
  .settings-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .settings-stop-block {
    margin-bottom: 22px;
  }
  .settings-stop-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .settings-route-block {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .settings-route-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .settings-route-title.south { color: var(--south); }
  .settings-route-title.north { color: var(--north); }
  .settings-hour-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 0;
  }
  .settings-hour-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    min-width: 24px;
    padding-top: 3px;
  }
  .settings-min-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex: 1;
  }
  .settings-min-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--bg3);
    color: var(--text);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.1s;
    user-select: none;
  }
  .settings-min-chip:hover { border-color: var(--border); }
  .settings-min-chip.cancelled {
    background: rgba(255,107,107,0.12);
    color: #FF6B6B;
    text-decoration: line-through;
    border-color: rgba(255,107,107,0.3);
  }
  .settings-clear-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .settings-clear-btn:hover { background: var(--bg4); color: var(--text); }

  /* ─── Cancelled bus chip on main timetable ─── */
  .min-chip.cancelled {
    background: rgba(255,107,107,0.08);
    color: #FF6B6B;
    text-decoration: line-through;
    text-decoration-color: rgba(255,107,107,0.5);
  }
  .min-chip.cancelled.next { background: rgba(255,107,107,0.15); color: #FF6B6B; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🚌 社内シャトルバス</div>
  <div class="header-right">
    <div class="header-datetime">
      <div class="header-date" id="clock-date">--/--(-)</div>
      <div class="header-clock" id="clock">--:--:--</div>
    </div>
    <button class="header-settings-btn" onclick="showSettings()" title="設定" aria-label="設定">⚙️</button>
  </div>
</div>

<div class="main-page open" id="mainPage">

<!-- Closing time bar -->
<div class="closing-bar">
  <div class="closing-label">閉業時間</div>
  <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1;">
    <div class="closing-btns" id="closingBtns">
      <button class="closing-btn" data-val="19" onclick="setClosing(19)">19時台</button>
      <button class="closing-btn" data-val="20" onclick="setClosing(20)">20時台</button>
      <button class="closing-btn active" data-val="21" onclick="setClosing(21)">21時台</button>
      <button class="closing-btn" data-val="22" onclick="setClosing(22)">22時台</button>
    </div>
    <div id="usj-status" style="margin-left:auto; font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:6px;">
      <span id="usj-dot" style="width:6px;height:6px;border-radius:50%;background:var(--text-dim);display:inline-block;"></span>
      <span id="usj-label">USJ営業時間を取得中…</span>
      <button onclick="fetchUSJHours()" style="background:var(--bg3);border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;font-family:Inter,sans-serif;">更新</button>
    </div>
  </div>
</div>

<!-- Stop tabs -->
<div class="stop-tabs">
  <div class="stop-tab active" id="tab-deck" onclick="setStop('deck')">
    <span class="stop-icon">🏢</span>デッキオフィス
  </div>
  <div class="stop-tab" id="tab-cs" onclick="setStop('cs')">
    <span class="stop-icon">🏗️</span>CS棟
  </div>
</div>

<!-- Next bus hero -->
<div class="next-bus-grid">
  <div class="next-bus-card south">
    <div class="route-badge south"><div class="route-dot south"></div>SOUTH</div>
    <div class="next-time south" id="next-south-time">--:--</div>
    <div class="next-countdown">あと <span id="next-south-min">--</span> 分</div>
    <div class="next-after" id="next-south-after"></div>
  </div>
  <div class="next-bus-card north">
    <div class="route-badge north"><div class="route-dot north"></div>NORTH</div>
    <div class="next-time north" id="next-north-time">--:--</div>
    <div class="next-countdown">あと <span id="next-north-min">--</span> 分</div>
    <div class="next-after" id="next-north-after"></div>
  </div>
</div>

<!-- Timetable -->
<div class="timetable-section">
  <div class="route-table" id="table-south">
    <div class="route-header south"><div class="route-dot south"></div>SOUTH ROUTE</div>
    <div id="south-rows"></div>
  </div>
  <div class="route-table" id="table-north">
    <div class="route-header north"><div class="route-dot north"></div>NORTH ROUTE</div>
    <div id="north-rows"></div>
  </div>
</div>

<div class="closing-note" id="closing-note"></div>

</div><!-- /main-page -->

<!-- Settings page -->
<div class="settings-page" id="settingsPage">
  <div class="settings-header">
    <h2>⚙️ 運休設定</h2>
    <button class="settings-back-btn" onclick="hideSettings()">← 戻る</button>
  </div>
  <div class="settings-desc">
    シーズンにより運休する便をタップして「運休」に切り替えられます。設定はこの端末に保存され、時刻表と次発表示に反映されます。
  </div>
  <button class="settings-clear-btn" onclick="clearAllCancelled()">運休設定をすべて解除</button>
  <div id="settings-body"></div>
</div>

<script>
// ─── Timetable data ──────────────────────────────────────────────────
// getSchedule(stop, route, closing) → [{hour, minutes:[]}]
// closing: 19/20/21/22
function getSchedule(stop, route, closing) {
  // minutes patterns
  const P10 = [0,10,20,30,40,50];   // every 10 min
  const P10S = [6,16,26,36,46,56];  // south deck every 10min
  const P10N6 = [6,16,26,36,46,56]; // north deck every 10min
  const P15 = [0,15,30,45];
  const P15S6 = [6,21,36,51];       // south deck 15min pattern
  const P15N = [13,28,43,58];       // north

  // Return by stop+route
  if (stop === 'deck') {
    if (route === 'south') {
      return buildDeckSouth(closing);
    } else {
      return buildDeckNorth(closing);
    }
  } else {
    if (route === 'south') {
      return buildCSSouth(closing);
    } else {
      return buildCSNorth(closing);
    }
  }
}

function buildDeckSouth(c) {
  const base = [
    {h:6,  m:[6,16,26,36,46,56]},
    {h:7,  m:[6,16,26,36,46,56]},
    {h:8,  m:[6,16,26,36,46,56]},
    {h:9,  m:[6,16,26,36,46,56]},
    {h:10, m:[6,16,26,36,46,56]},
    {h:11, m:[6,21,36,51]},
    {h:12, m:[6,21,36,51]},
    {h:13, m:[6,21,36,51]},
    {h:14, m:[6,21,36,51]},
    {h:15, m:[6,21,36,51]},
    {h:16, m:[6,16,26,36,46,56]},
    {h:17, m:[6,16,26,36,46,56]},
    {h:18, m:[6,16,26,36,46,56]},
    {h:19, m:[6,16,26,36,46,56]},
    {h:20, m:[6,16,26,36,46,56]},
  ];
  if (c === 19) {
    base.push({h:21, m:[6,21,36,51]});
    base.push({h:22, m:[6,21,36,51]});
  } else if (c === 20) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[6,21,36,51]});
  } else if (c === 21) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[6,16,26,36,46,56]});
    base.push({h:23, m:[6,16,26,36,46,56]});
  } else if (c === 22) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[6,16,26,36,46,56]});
    base.push({h:23, m:[6,16,26,36,46,56]});
    base.push({h:24, m:[6,21]});
  }
  return base;
}

function buildDeckNorth(c) {
  const base = [
    {h:6,  m:[16,26,36,46,56]},
    {h:7,  m:[6,16,26,36,46,56]},
    {h:8,  m:[6,16,26,36,46,56]},
    {h:9,  m:[6,16,26,36,46,56]},
    {h:10, m:[6,16,26,36,46,56]},
    {h:11, m:[13,28,43,58]},
    {h:12, m:[13,28,43,58]},
    {h:13, m:[13,28,43,58]},
    {h:14, m:[13,28,43,58]},
    {h:15, m:[13,28,43,58]},
    {h:16, m:[6,16,26,36,46,56]},
    {h:17, m:[6,16,26,36,46,56]},
    {h:18, m:[6,16,26,36,46,56]},
    {h:19, m:[6,16,26,36,46,56]},
    {h:20, m:[6,16,26,36,46,56]},
  ];
  if (c === 19) {
    base.push({h:21, m:[13,28,43,58]});
    base.push({h:22, m:[13,28,43,58]});
  } else if (c === 20) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[13,28,43,58]});
  } else if (c === 21) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[6,16,26,36,46,56]});
    base.push({h:23, m:[6,16,26,36,46,56]});
  } else if (c === 22) {
    base.push({h:21, m:[6,16,26,36,46,56]});
    base.push({h:22, m:[6,16,26,36,46,56]});
    base.push({h:23, m:[6,16,26,36,46,56]});
    base.push({h:24, m:[16,26]});
  }
  return base;
}

function buildCSSouth(c) {
  const base = [
    {h:6,  m:[0,10,20,30,40,50]},
    {h:7,  m:[0,10,20,30,40,50]},

// ─── State ──────────────────────────────────────────────────────────
let currentStop = 'deck';
let currentClosing = 21;

// ─── Cancelled buses (運休設定) ────────────────────────────────────────
// key format: "<stop>|<route>|<h>|<m>" — persisted to localStorage
const CANCELLED_KEY = 'busCancelledSet';
let cancelledSet = loadCancelled();

function loadCancelled() {
  try {
    const raw = localStorage.getItem(CANCELLED_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    return new Set();
  }
}

function saveCancelled() {
  try {
    localStorage.setItem(CANCELLED_KEY, JSON.stringify([...cancelledSet]));
  } catch (e) {
    console.error('cancelled save error:', e);
  }
}

function cancelKey(stop, route, h, m) {
  return `${stop}|${route}|${h}|${m}`;
}

function isCancelled(stop, route, h, m) {
  return cancelledSet.has(cancelKey(stop, route, h, m));
}

function toggleCancelled(stop, route, h, m) {
  const key = cancelKey(stop, route, h, m);
  if (cancelledSet.has(key)) {
    cancelledSet.delete(key);
  } else {
    cancelledSet.add(key);
  }
  saveCancelled();
  renderSettings();
  renderAll();
}

function clearAllCancelled() {
  if (!confirm('運休設定をすべて解除しますか？')) return;
  cancelledSet.clear();
  saveCancelled();
  renderSettings();
  renderAll();
}

// Union of all hour/minute combos across every closing setting, for a stop+route.
// Used so the settings page can list every possible departure regardless of
// which 閉業時間 is currently selected.
function getAllTimesForStopRoute(stop, route) {
  const map = new Map(); // h -> Set(minutes)
  for (const c of [19, 20, 21, 22]) {
    const sched = getSchedule(stop, route, c);
    for (const row of sched) {
      if (!map.has(row.h)) map.set(row.h, new Set());
      for (const m of row.m) map.get(row.h).add(m);
    }
  }
  return [...map.keys()].sort((a,b) => a-b).map(h => ({
    h, m: [...map.get(h)].sort((a,b) => a-b)
  }));
}

function setStop(s) {
  currentStop = s;
  document.getElementById('tab-deck').classList.toggle('active', s === 'deck');
  document.getElementById('tab-cs').classList.toggle('active', s === 'cs');
  renderAll();
}

function setClosing(c) {
  currentClosing = c;
  document.querySelectorAll('.closing-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.val) === c);
  });
  renderAll();
}

// ─── Time helpers ────────────────────────────────────────────────────
function nowMinutes() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

// Find next N buses from schedule (skips buses marked 運休)
function nextBuses(schedule, n=2, stop, route) {
  const nm = nowMinutes();
  const results = [];
  for (const row of schedule) {
    for (const min of row.m) {
      if (stop && route && isCancelled(stop, route, row.h, min)) continue;
      const t = row.h * 60 + min;
      if (t > nm) results.push({h: row.h, m: min, total: t});
      if (results.length >= n) return results;
    }
  }
  return results;
}

function fmtHM(h, m) {
  const hh = h >= 24 ? h - 24 : h;
  return String(hh).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function pad2(n) { return String(n).padStart(2,'0'); }

// ─── Render ──────────────────────────────────────────────────────────
function renderAll() {
  const now = new Date();
  const curH = now.getHours();
  const curM = now.getMinutes();
  const nm = nowMinutes();

  const sSched = getSchedule(currentStop, 'south', currentClosing);
  const nSched = getSchedule(currentStop, 'north', currentClosing);

  // Next bus cards
  function renderNextCard(sched, route) {
    const buses = nextBuses(sched, 2, currentStop, route);
    const timeEl = document.getElementById(`next-${route}-time`);
    const minEl  = document.getElementById(`next-${route}-min`);
    const afterEl = document.getElementById(`next-${route}-after`);

    if (buses.length === 0) {
      timeEl.textContent = '終了';
      minEl.textContent = '--';
      minEl.className = '';
      afterEl.textContent = '';
      return;
    }
    const b = buses[0];
    const diff = b.total - nm;
    timeEl.textContent = fmtHM(b.h, b.m);
    minEl.textContent = diff;
    minEl.className = diff <= 3 ? 'soon' : '';

    if (buses[1]) {
      afterEl.textContent = '次々 ' + fmtHM(buses[1].h, buses[1].m);
    } else {
      afterEl.textContent = '';
    }
  }
  renderNextCard(sSched, 'south');
  renderNextCard(nSched, 'north');

  // Timetable rows
  function renderRows(sched, containerId, route) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    // Get the next bus time (total minutes) — skips cancelled buses
    const nextBus = nextBuses(sched, 1, currentStop, route)[0];

    for (const row of sched) {
      const isCurrentHour = row.h === curH || (row.h === 24 && curH === 0);
      const div = document.createElement('div');
      div.className = 'time-row' + (isCurrentHour ? ' current-hour' : '');

      const hLabel = document.createElement('div');
      hLabel.className = 'hour-label' + (isCurrentHour ? ' current' : '');
      hLabel.textContent = (row.h >= 24 ? row.h - 24 : row.h);
      div.appendChild(hLabel);

      const wrap = document.createElement('div');
      wrap.className = 'minutes-wrap';

      for (const min of row.m) {
        const total = row.h * 60 + min;
        const cancelled = isCancelled(currentStop, route, row.h, min);
        const chip = document.createElement('div');
        chip.className = 'min-chip';
        chip.textContent = pad2(min);

        if (cancelled) {
          chip.classList.add('cancelled');
          chip.title = '運休';
        } else if (total < nm) {
          chip.classList.add('passed');
        } else if (nextBus && total === nextBus.total) {
          chip.classList.add('next', route);
        }
        wrap.appendChild(chip);
      }
      div.appendChild(wrap);
      container.appendChild(div);
    }
  }
  renderRows(sSched, 'south-rows', 'south');
  renderRows(nSched, 'north-rows', 'north');

  // Closing note
  const noteEl = document.getElementById('closing-note');
  const labels = {19:'19時台',20:'20時台',21:'21時台',22:'22時台'};
  noteEl.textContent = `閉業設定：${labels[currentClosing]}閉業`;
}

// ─── Clock ────────────────────────────────────────────────────────────
const WEEKDAY_JA = ['日','月','火','水','木','金','土'];

function updateClock() {
  const now = new Date();
  document.getElementById('clock-date').textContent =
    (now.getMonth() + 1) + '/' + now.getDate() + '(' + WEEKDAY_JA[now.getDay()] + ')';
  document.getElementById('clock').textContent =
    pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
  renderAll();
}

updateClock();
setInterval(updateClock, 1000);

// ─── Settings page ─────────────────────────────────────────────────────
const STOP_LABELS = { deck: '🏢 デッキオフィス', cs: '🏗️ CS棟' };

function showSettings() {
  renderSettings();
  document.getElementById('mainPage').classList.add('hidden');
  document.getElementById('settingsPage').classList.add('open');
}

function hideSettings() {
  document.getElementById('settingsPage').classList.remove('open');
  document.getElementById('mainPage').classList.remove('hidden');
}

function renderSettings() {
  const body = document.getElementById('settings-body');
  body.innerHTML = '';

  for (const stop of ['deck', 'cs']) {
    const stopBlock = document.createElement('div');
    stopBlock.className = 'settings-stop-block';

    const stopTitle = document.createElement('div');
    stopTitle.className = 'settings-stop-title';
    stopTitle.textContent = STOP_LABELS[stop];
    stopBlock.appendChild(stopTitle);

    for (const route of ['south', 'north']) {
      const routeBlock = document.createElement('div');
      routeBlock.className = 'settings-route-block';

      const routeTitle = document.createElement('div');
      routeTitle.className = 'settings-route-title ' + route;
      routeTitle.textContent = route === 'south' ? 'SOUTH ROUTE' : 'NORTH ROUTE';
      routeBlock.appendChild(routeTitle);

      const times = getAllTimesForStopRoute(stop, route);
      for (const row of times) {
        const hourRow = document.createElement('div');
        hourRow.className = 'settings-hour-row';

        const hLabel = document.createElement('div');
        hLabel.className = 'settings-hour-label';
        hLabel.textContent = (row.h >= 24 ? row.h - 24 : row.h);
        hourRow.appendChild(hLabel);

        const wrap = document.createElement('div');
        wrap.className = 'settings-min-wrap';

        for (const min of row.m) {
          const chip = document.createElement('div');
          const cancelled = isCancelled(stop, route, row.h, min);
          chip.className = 'settings-min-chip' + (cancelled ? ' cancelled' : '');
          chip.textContent = pad2(min);
          chip.title = cancelled ? 'タップで運休解除' : 'タップで運休に設定';
          chip.onclick = () => toggleCancelled(stop, route, row.h, min);
          wrap.appendChild(chip);
        }
        hourRow.appendChild(wrap);
        routeBlock.appendChild(hourRow);
      }
      stopBlock.appendChild(routeBlock);
    }
    body.appendChild(stopBlock);
  }
}

// ─── USJ Auto-fetch ───────────────────────────────────────────────────
async function fetchUSJHours() {
  const dotEl   = document.getElementById('usj-dot');
  const labelEl = document.getElementById('usj-label');
  dotEl.style.background = 'var(--accent)';
  labelEl.textContent = '取得中…';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: `You are a helper that fetches today's USJ (Universal Studios Japan) park hours.
Use web_search to fetch https://usjreal.asumirai.info/ and find the section labeled 開園時間 which shows hours like "9:00 〜 20:00".
Return ONLY a JSON object with no markdown, no explanation, no backticks.
Required keys:
  "open": opening time in "HH:MM" 24h format (e.g. "09:00")
  "close": closing time in "HH:MM" 24h format (e.g. "20:00")
  "closeHour": integer of the closing hour only (e.g. 20)
  "raw": the original time string found on the page (e.g. "9:00 〜 20:00")
Example: {"open":"09:00","close":"20:00","closeHour":20,"raw":"9:00 〜 20:00"}`,
        messages: [{
          role: 'user',
          content: "Search for https://usjreal.asumirai.info/ and extract today's park hours from the 開園時間 section. Return only the JSON."
        }]
      })
    });

    const data = await res.json();
    const text = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('');

    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    const closeH = parsed.closeHour;
    const validOptions = [19, 20, 21, 22];
    const matched = validOptions.includes(closeH) ? closeH : 21;

    setClosing(matched);

    dotEl.style.background = 'var(--north)';
    labelEl.textContent = `USJ ${parsed.raw}（閉園${closeH}時台を自動設定）`;
  } catch(e) {
    dotEl.style.background = '#FF6B6B';
    labelEl.textContent = '取得失敗 — 手動で設定してください';
    console.error('USJ fetch error:', e);
  }
}

// Auto-fetch on load
fetchUSJHours();
